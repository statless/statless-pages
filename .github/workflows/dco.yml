name: dco
on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          case "$PR_AUTHOR" in
            'dependabot[bot]'|'app/dependabot'|'renovate[bot]')
              echo "Skipping DCO check for automated PR from $PR_AUTHOR."
              exit 0
              ;;
          esac

          missing=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            if [ -z "$(git show -s --format='%(trailers:key=Signed-off-by)' "$sha")" ]; then
              subject="$(git show -s --format='%s' "$sha")"
              echo "::error::commit $sha (\"$subject\") is missing a Signed-off-by trailer"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Fix: git commit --amend -s, or git rebase --signoff ${BASE_SHA}"
            echo "See CONTRIBUTING.md for the Developer Certificate of Origin."
            exit 1
          fi

          echo "All commits carry a Signed-off-by trailer."
