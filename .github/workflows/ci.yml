name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check collector tests
      - name: Format check
        run: uv run ruff format --check collector tests
      - name: Typecheck
        run: uv run pyright
      - name: Test
        run: uv run pytest -q
