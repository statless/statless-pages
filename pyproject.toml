[project]
name = "statless-pages"
version = "0.1.0"
description = "Self-hostable, cookie-free view, referrer, and dwell-time tracker for Notion, Substack, and GitHub README files."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Dimitrios Xynos" }]
keywords = ["analytics", "privacy", "notion", "selfhosted", "fastapi"]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "geoip2>=4.8",
  "maxminddb>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
]

[project.scripts]
statless = "collector.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PT", "RET", "ASYNC"]

[tool.pyright]
include = ["collector", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]

